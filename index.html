$('cc').onclick=stop;
$('scan').onclick=async function(){ctx=ctx||mk();
if(!('BarcodeDetector' in window)||!navigator.mediaDevices){$('pic').click();return}
try{var det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
var v=$('vid');v.srcObject=stream;$('cam').style.display='flex';await v.play();
timer=setInterval(async function(){try{var r=await det.detect(v);if(r.length){var c=r[0].rawValue;stop();run(c)}}catch(e){}},250)}
catch(e){stop();$('out').innerHTML='<div class="card">Camera could not open ('+(e.name||'error')+'). Allow camera permission, or take a photo of the barcode instead.</div>';tab(1);$('pic').click()}};
$('pic').onchange=async function(){var f=this.files[0];this.value='';if(!f)return;
try{var det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});var r=await det.detect(await createImageBitmap(f));if(r.length)run(r[0].rawValue);else{$('out').innerHTML='<div class="card">No barcode found in that photo. Try again, closer and well lit, or type the number.</div>';tab(1)}}
catch(e){$('out').innerHTML='<div class="card">Barcode reading is not supported in this browser. Please type the number under the barcode, or open this page in Chrome on Android.</div>';tab(1)}};
hist();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script></body></html>
